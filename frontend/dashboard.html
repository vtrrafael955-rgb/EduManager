<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EduManager - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#f4f7fb}.sidebar{width:250px;min-height:100vh;background:#212529}
.nav-link{color:#ddd}.nav-link.active,.nav-link:hover{background:#0d6efd;color:#fff;border-radius:8px}
.user-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover}
.card-stat{border:none;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="d-flex">
<div class="sidebar p-3 text-white d-flex flex-column">
<h3>🎓 EduManager</h3><hr>
<a class="nav-link active p-2" href="#">Dashboard</a>
<div class="mt-auto">
<button class="btn btn-danger w-100" onclick="logout()">Sair</button>
</div>
</div>
<div class="flex-grow-1 p-4">
<div class="d-flex justify-content-between align-items-center mb-4">
<div><h2>Painel de Controle</h2></div>
<div class="d-flex align-items-center gap-3">
<button class="btn btn-success" onclick="dashboard.baixarRelatorio()">Excel</button>
<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoEvento">Novo Evento</button>
<img id="userPhoto" class="user-avatar" src="">
<div><div id="userName">Utilizador</div><small id="userEmail"></small></div>
</div></div>
<div class="row g-3 mb-4">
<div class="col"><div class="card card-stat p-3"><small>Eventos</small><h2 id="eventos">0</h2></div></div>
<div class="col"><div class="card card-stat p-3"><small>Participantes</small><h2 id="participantes">0</h2></div></div>
<div class="col"><div class="card card-stat p-3"><small>Turmas</small><h2 id="turmas">0</h2></div></div>
</div>
<div class="card">
<div class="card-header">Eventos</div>
<div class="card-body p-0">
<table class="table mb-0">
<thead><tr><th>Evento</th><th>Início</th><th>Fim</th><th>Status</th><th>Ações</th></tr></thead>
<tbody id="listaEventos"><tr><td colspan="5" class="text-center">Nenhum evento cadastrado.</td></tr></tbody>
</table>
</div></div>
</div></div>

<div class="modal fade" id="modalNovoEvento" tabindex="-1">
<div class="modal-dialog"><div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Novo Evento</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<form id="formEvento" onsubmit="event.preventDefault();dashboard.adicionarEvento(document.getElementById('inputNome').value,document.getElementById('inputInicio').value,document.getElementById('inputFim').value,document.getElementById('selectStatus').value);this.reset();bootstrap.Modal.getInstance(document.getElementById('modalNovoEvento')).hide();">
<div class="mb-3"><label>Nome</label><input id="inputNome" class="form-control" required></div>
<div class="row">
<div class="col"><label>Início</label><input id="inputInicio" type="date" class="form-control" required></div>
<div class="col"><label>Fim</label><input id="inputFim" type="date" class="form-control" required></div>
</div>
<div class="mt-3"><label>Status</label><select id="selectStatus" class="form-select"><option>Aberto</option><option>Fechado</option></select></div>
<div class="mt-3 text-end"><button class="btn btn-primary">Salvar</button></div>
</form>
</div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
