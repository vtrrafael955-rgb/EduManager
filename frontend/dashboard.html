<div class="modal fade" id="modalNovoEvento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Cadastrar Novo Evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formEvento" onsubmit="processarNovoEvento(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome do Evento</label>
                        <input type="text" id="inputNome" class="form-control" required placeholder="Ex: Escolha de Tutores">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descrição</label>
                        <textarea id="inputDesc" class="form-control" rows="2" placeholder="Detalhes do evento..."></textarea>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">Data Início</label>
                            <input type="date" id="inputInicio" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">Data Fim</label>
                            <input type="date" id="inputFim" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Status</label>
                        <select id="selectStatus" class="form-select">
                            <option value="Aberto">Aberto</option>
                            <option value="Rascunho">Rascunho</option>
                            <option value="Fechado">Fechado</option>
                        </select>
                    </div>
                    <div class="modal-footer px-0 pb-0 pt-3">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Evento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function processarNovoEvento(e) {
        e.preventDefault();
        const nome = document.getElementById("inputNome").value;
        const descricao = document.getElementById("inputDesc").value;
        const inicio = document.getElementById("inputInicio").value;
        const fim = document.getElementById("inputFim").value;
        const status = document.getElementById("selectStatus").value;

        // Chama o método estruturado no dashboard.js
        dashboard.adicionarEvento(nome, descricao, inicio, fim, status);

        // Limpa o form e fecha o modal via Bootstrap
        document.getElementById("formEvento").reset();
        const modalEl = document.getElementById("modalNovoEvento");
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
    }
</script>
