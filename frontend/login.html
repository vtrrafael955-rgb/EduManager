<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row vh-100 align-items-center justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">EduManager</h2>
                            <p class="text-muted small">Acesse sua conta para gerenciar seus eventos</p>
                        </div>

                        <form onsubmit="fazerLogin(event)">
                            <div class="mb-3">
                                <label class="form-label fw-bold small">E-mail</label>
                                <input type="email" id="inputEmail" class="form-control" required placeholder="seu.email@exemplo.com" value="admin@edumanager.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Senha</label>
                                <input type="password" id="inputSenha" class="form-control" required placeholder="••••••••" value="123456">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 mb-3">
                                🚀 Entrar no Sistema
                            </button>
                        </form>

                        <div class="text-center">
                            <a href="/index.html" class="text-decoration-none text-muted small">← Voltar ao início</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
