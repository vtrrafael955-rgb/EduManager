<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row vh-100 align-items-center justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-5 text-center">
                        <div class="mb-4">
                            <h2 class="fw-bold text-primary mb-2">EduManager</h2>
                            <p class="text-muted small">Faça login com a sua conta Google para gerenciar o sistema</p>
                        </div>

                        <div id="g_id_onload"
                             data-client_id="782376662205-tuh98d4gn2bmnlgfauqnt49bbpf80e57.apps.googleusercontent.com"
                             data-callback="handleCredentialResponse"
                             data-auto_select="false"
                             data-use_fedcm_for_prompt="false">
                        </div>

                        <div class="d-flex justify-content-center mb-4">
                            <div class="g_id_signin"
                                 data-type="standard"
                                 data-size="large"
                                 data-theme="outline"
                                 data-text="sign_in_with"
                                 data-shape="rectangular"
                                 data-logo_alignment="left">
                            </div>
                        </div>

                        <div class="mt-4 border-top pt-3">
                            <a href="/index.html" class="text-decoration-none text-muted small">← Voltar à página inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/js/auth.js"></script>
</body>
</html>
